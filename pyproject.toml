[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plotdeck"
version = "1.0.0"
description = "G-code sender and editor for GRBL-based CNC routers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
]

[project.optional-dependencies]
3d = ["PyOpenGL>=3.1"]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "black>=24",
    "mypy>=1.10",
    "pyinstaller>=6",
]

[project.scripts]
plotdeck = "plotdeck.app:main"

[project.gui-scripts]
plotdeck-gui = "plotdeck.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plotdeck = ["ui/resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = ["src"]
